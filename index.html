<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>你是哪种小狗？· 恋爱人格小测试</title>
<style>
:root{
  --pink:#ff8fb2; --ink:#4a3a44; --ink-2:#8a7a84; --card:rgba(255,255,255,.80);
  --shadow:0 18px 40px rgba(214,140,170,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#ffe9f1 0%,#fff4ea 42%,#eaf2ff 100%);
  background-attachment:fixed;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.pawbg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.pawbg span{position:absolute;font-size:26px;opacity:.16;animation:floatUp linear infinite}
@keyframes floatUp{
  0%{transform:translateY(20px) rotate(0deg) scale(.9);opacity:0}
  12%{opacity:.18}
  88%{opacity:.14}
  100%{transform:translateY(-108vh) rotate(28deg) scale(1.1);opacity:0}
}
.wrap{width:100%;max-width:440px;position:relative;z-index:1}
.card{
  background:var(--card);border-radius:28px;padding:26px 22px 24px;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  animation:pop .5s cubic-bezier(.2,.9,.25,1.1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.hide{display:none!important}
.badge{display:inline-block;font-size:12px;letter-spacing:.14em;color:#e2678f;
  background:#ffdfe9;border-radius:99px;padding:5px 12px;margin-bottom:14px;font-weight:600}
h1{font-size:30px;line-height:1.28;margin:0 0 10px;letter-spacing:-.5px}
h1 em{font-style:normal;background:linear-gradient(120deg,#ff7ea6,#ff9d6e);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink-2);font-size:14px;line-height:1.7;margin:0 0 18px}
.dogline{text-align:center;font-size:52px;line-height:1;margin:6px 0 12px;letter-spacing:6px}
.dogline span{display:inline-block;animation:bob 2.2s ease-in-out infinite}
.dogline span:nth-child(2){animation-delay:.25s}
.dogline span:nth-child(3){animation-delay:.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
input[type=text]{width:100%;border:1.5px solid #ffdbe6;background:#fff;border-radius:16px;
  padding:14px 16px;font-size:16px;color:var(--ink);outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s}
input[type=text]:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ffe4ec}
.hint{font-size:12px;color:#b6a3ad;margin:8px 2px 18px}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:700;
  font-family:inherit;color:#fff;cursor:pointer;
  background:linear-gradient(120deg,#ff7fa8,#ffa07a);
  box-shadow:0 12px 24px rgba(255,127,168,.35);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.975);box-shadow:0 6px 14px rgba(255,127,168,.3)}
.btn.ghost{background:#fff;color:#e2678f;border:1.5px solid #ffd3e1;box-shadow:none}
.btn.ghost:active{background:#fff6f9}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.step{font-size:13px;color:#b6a3ad;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:#ffe6ee;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ffa6c1,#ffc27a);transition:width .45s cubic-bezier(.3,.9,.3,1)}
.qnum{font-size:13px;font-weight:700;color:#e2678f;letter-spacing:.08em}
.q{font-size:21px;font-weight:700;line-height:1.45;margin:10px 0 18px;letter-spacing:-.2px}
.opt{width:100%;text-align:left;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:#fff;border:1.5px solid #ffe0ea;border-radius:18px;padding:16px;
  margin-bottom:11px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;
  transition:border-color .18s,transform .14s,background .18s,box-shadow .18s}
.opt:active{transform:scale(.98)}
.opt .k{flex:0 0 24px;height:24px;border-radius:9px;background:#fff0f5;color:#e2678f;
  font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.opt.sel{border-color:var(--pink);background:#fff5f8;box-shadow:0 8px 18px rgba(255,143,178,.22)}
.opt.sel .k{background:linear-gradient(120deg,#ff7fa8,#ffa07a);color:#fff}
.backb{background:none;border:0;color:#b6a3ad;font-size:14px;font-family:inherit;padding:8px 2px;cursor:pointer}
.rEmoji{font-size:66px;line-height:1;text-align:center;margin:4px 0 6px;animation:bob 2.6s ease-in-out infinite}
.rName{text-align:center;font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.3px}
.rTag{text-align:center;color:#e2678f;font-size:15px;font-weight:600;margin:0 0 18px}
.sec{margin:0 0 16px}
.sec h3{font-size:14px;color:#b6a3ad;font-weight:700;letter-spacing:.1em;margin:0 0 9px}
.sec p{margin:0;font-size:15px;line-height:1.75;color:#5c4a55}
.sec ul{margin:0;padding-left:18px}
.sec li{font-size:15px;line-height:1.75;color:#5c4a55}
.quote{background:linear-gradient(120deg,#fff1f6,#fff7f0);border-radius:18px;
  padding:15px 16px;font-size:15px;line-height:1.75;color:#6b5560;border:1px dashed #ffd3e1}
.mix{margin:2px 0 18px}
.mix .row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;color:#8a7a84}
.mix .row b{flex:0 0 62px;font-weight:600;color:#6b5560}
.mix .track{flex:1;height:8px;border-radius:99px;background:#ffe9f0;overflow:hidden}
.mix .track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ffb08f,#ff8fb2);width:0;transition:width .9s cubic-bezier(.25,.9,.3,1)}
.mix .row span{flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums}
.rowbtns{display:flex;gap:10px;margin-top:6px}
.rowbtns .btn{font-size:15px;padding:14px}
.foot{text-align:center;font-size:12px;color:#c3b1ba;margin-top:16px;line-height:1.7}
.heart{position:fixed;font-size:20px;pointer-events:none;z-index:99;animation:fall 1.9s ease-in forwards}
@keyframes fall{
  0%{transform:translate(0,0) scale(.6) rotate(0);opacity:0}
  15%{opacity:1}
  100%{transform:translate(var(--dx),72vh) scale(1.1) rotate(var(--rot));opacity:0}
}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:rgba(74,58,68,.94);color:#fff;font-size:14px;padding:11px 18px;border-radius:99px;
  opacity:0;transition:.3s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="pawbg" id="pawbg"></div>
<div class="wrap">
  <section class="card" id="cover">
    <div class="badge">恋爱人格小测试</div>
    <h1>你是哪种<br><em>小狗</em>？</h1>
    <div class="dogline"><span>🐶</span><span>🐕</span><span>🐩</span></div>
    <p class="sub">8 道题，找出你心里那只小狗。<br>顺便告诉他：该怎么爱你。</p>
    <input type="text" id="nameInput" maxlength="8" placeholder="你的小名（可不填）">
    <div class="hint">填了名字，结果会叫你哦 ✿</div>
    <button class="btn" id="startBtn">开始测试</button>
    <div class="foot">题目没有好坏，选第一反应就好</div>
  </section>

  <section class="card hide" id="quiz">
    <div class="top">
      <div class="step" id="stepText">1 / 8</div>
      <div class="step" id="pctText">0%</div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div style="height:20px"></div>
    <div class="qnum" id="qnum">Q1</div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <button class="backb" id="backBtn">← 上一题</button>
  </section>

  <section class="card hide" id="result">
    <div class="rEmoji" id="rEmoji">🐶</div>
    <h2 class="rName" id="rName"></h2>
    <p class="rTag" id="rTag"></p>
    <div class="mix" id="mix"></div>
    <div class="sec"><h3>你的小狗性格</h3><ul id="rTraits"></ul></div>
    <div class="sec"><h3>你需要什么样的铲屎官</h3><div class="quote" id="rOwner"></div></div>
    <div class="sec"><h3>最佳搭档犬种</h3><p id="rBest"></p></div>
    <div class="sec"><h3>今日小任务</h3><p id="rMission"></p></div>
    <div class="rowbtns">
      <button class="btn" id="copyBtn">复制结果</button>
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>
    <div class="foot">截图发给他，比说一百句更有效 🐾</div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var box = document.getElementById('pawbg');
  var chars = ['🐾','✦','♡','🐾','✧'];
  for(var i=0;i<14;i++){
    var s = document.createElement('span');
    s.textContent = chars[i % chars.length];
    s.style.left = (Math.random()*100).toFixed(1) + '%';
    s.style.bottom = '-40px';
    s.style.fontSize = (14 + Math.random()*20).toFixed(0) + 'px';
    s.style.animationDuration = (16 + Math.random()*16).toFixed(1) + 's';
    s.style.animationDelay = (-Math.random()*22).toFixed(1) + 's';
    box.appendChild(s);
  }
})();

var TYPES = {
  golden:{ emoji:'🦮', name:'金毛寻回犬', tag:'行走的小太阳，气氛一下暖三度',
    traits:['天生会照顾人，别人不开心你总第一个发现','不记仇，气不过三分钟就想再贴贴','表达爱从来不害羞，喜欢就直接说喜欢'],
    owner:'你需要一个能和你并肩坐着的铲屎官：不用你一直去哄人，你也可以偶尔把脑袋搁在他腿上，什么都不用说。',
    best:'柯基——你负责暖，他负责把日子闹得热热闹闹。',
    mission:'今天主动抱一次人，认真说一句「有你真好」。' },
  corgi:{ emoji:'🐶', name:'柯基', tag:'元气短腿小炸弹，情绪来得快去得也快',
    traits:['一开心就原地转圈，完全藏不住','黏人程度 10/10，但很有分寸感','撒起娇来，没人扛得住'],
    owner:'需要一个腿够长（能抱着你走一段）、口袋够深（随时能变出小零食）的铲屎官。',
    best:'金毛——你负责蹦跶，他负责稳稳接住你。',
    mission:'用你最夸张的语气夸他一次，看他什么反应。' },
  shiba:{ emoji:'🐕‍🦺', name:'柴犬', tag:'嘴上说不要，身体很诚实地靠近了',
    traits:['有自己的节奏，讨厌被安排','冷着脸讲冷笑话，笑点全在别人身上','其实很在意，只是不说出口'],
    owner:'需要一个不催你、但一直在的铲屎官：你往前走他就跟着，你停下来他也停下，从不问为什么。',
    best:'萨摩耶——你安静，他热闹，凑在一起刚刚好。',
    mission:'主动发一条「在干嘛」给他，什么都不用多说。' },
  border:{ emoji:'🐺', name:'边境牧羊犬', tag:'聪明到离谱的小军师，细节全记得',
    traits:['观察力惊人，你说过的话他都记着','出门前必须列清单，计划控本控','一旦认真起来，效率高得吓人'],
    owner:'需要一个尊重你脑子的铲屎官：能跟你聊正经事，也愿意在生活里听你指挥。',
    best:'金毛——你出方案，他负责把气氛变轻松。',
    mission:'把一件拖了很久的小事，今天做掉 5% 就好。' },
  pomeranian:{ emoji:'🐩', name:'博美', tag:'可爱是义务，精致是底线',
    traits:['对好看的东西毫无抵抗力','情绪细腻，被忽略一秒就能察觉','一旦认定谁，就把最好的自己给他'],
    owner:'需要一个会夸人的铲屎官：夸得具体、夸得及时、夸得真心，不能敷衍。',
    best:'柯基——你们凑一对，可爱度直接爆表。',
    mission:'今天为自己好好打扮一次，拍照发给他。' },
  samoyed:{ emoji:'🐻‍❄️', name:'萨摩耶', tag:'一笑就让人忘记烦恼（和刚掉的毛）',
    traits:['天生社交派，三句话就能把陌生人变熟人','情绪价值拉满，是朋友的情绪树洞','笑得最开心的那个，往往也偷偷累'],
    owner:'需要一个会问你「你今天开心吗」的铲屎官，而不是只在你笑的时候才靠近你。',
    best:'柴犬——你热他稳，一个暖场一个收场。',
    mission:'允许自己今天什么都不做，把电量全部留给自己。' },
  husky:{ emoji:'🐕', name:'哈士奇', tag:'自由的搞怪担当，计划？那是什么',
    traits:['突如其来的灵感型选手，说走就走','笑点清奇，冷场救星','讨厌被管，但需要有人在终点等你'],
    owner:'需要一个不拴着你、但钥匙永远给你的铲屎官：你尽管跑，回头他还在。',
    best:'边牧——他规划路线，你负责看风景。',
    mission:'拉他去做一件你们都没做过的小事。' }
};

var QUESTIONS = [
  { q:'周末最想去哪儿？', o:[
    { t:'叫上一堆人去野餐，人越多越热闹', s:{samoyed:2, golden:1} },
    { t:'窝在被窝里，谁也别叫我', s:{shiba:2, corgi:1} },
    { t:'去新开的店打卡，拍照一定好看', s:{pomeranian:2, corgi:1} },
    { t:'说走就走，随便坐上一班车', s:{husky:2, border:1} } ]},
  { q:'他惹你生气了，你会？', o:[
    { t:'直接说出来，撒个娇就过去了', s:{golden:2, corgi:1} },
    { t:'先冷着脸，等他来哄', s:{shiba:2, pomeranian:1} },
    { t:'装作不在意，心里记小本本', s:{border:2, shiba:1} },
    { t:'突然自己就笑了，气不过三分钟', s:{samoyed:2, husky:1} } ]},
  { q:'关于吃，你是哪种？', o:[
    { t:'一定要吃到最好吃的那一口', s:{pomeranian:2, shiba:1} },
    { t:'有吃的就行，量一定要大', s:{golden:2, corgi:1} },
    { t:'口味很固执，不爱吃的碰都不碰', s:{shiba:2, border:1} },
    { t:'什么都要试试，猎奇优先', s:{husky:2, samoyed:1} } ]},
  { q:'在朋友眼里，你是？', o:[
    { t:'气氛组，负责让大家开心', s:{samoyed:2, golden:1} },
    { t:'靠谱军师，什么都懂一点', s:{border:2, golden:1} },
    { t:'看着高冷，其实很好笑', s:{shiba:2, pomeranian:1} },
    { t:'小可爱，被大家宠着', s:{pomeranian:2, corgi:1} } ]},
  { q:'收到礼物时你的反应？', o:[
    { t:'眼睛发亮，原地转圈', s:{corgi:2, samoyed:1} },
    { t:'先看包装和颜值', s:{pomeranian:2, shiba:1} },
    { t:'淡定收下，回家偷偷开心', s:{shiba:2, border:1} },
    { t:'认真研究它是怎么做的', s:{border:2, husky:1} } ]},
  { q:'一起出去玩，你是哪种同伴？', o:[
    { t:'路线、餐厅全部提前排好', s:{border:2, golden:1} },
    { t:'什么都行，跟着走最省心', s:{golden:2, samoyed:1} },
    { t:'走一半喊累，要人牵', s:{corgi:2, pomeranian:1} },
    { t:'临时改计划，越乱越兴奋', s:{husky:2, samoyed:1} } ]},
  { q:'深夜的你通常在做？', o:[
    { t:'十点就困了，睡得像个小孩', s:{golden:2, corgi:1} },
    { t:'越想越多，脑子停不下来', s:{border:2, shiba:1} },
    { t:'突然想创作、想收拾房间', s:{husky:1, pomeranian:1, border:1} },
    { t:'有点 emo，需要有人陪', s:{corgi:2, samoyed:1} } ]},
  { q:'恋爱里，你最想要的是？', o:[
    { t:'一直被夸、被宠着', s:{pomeranian:2, corgi:1} },
    { t:'踏实的安全感，稳稳的陪伴', s:{golden:2, samoyed:1} },
    { t:'各自有空间，互不打扰', s:{shiba:2, border:1} },
    { t:'一起疯、一起玩、一起搞怪', s:{husky:2, samoyed:1} } ]}
];

var MAXP = {};
var KEYS = Object.keys(TYPES);
KEYS.forEach(function(k){ MAXP[k] = 0; });
QUESTIONS.forEach(function(q){
  KEYS.forEach(function(k){
    var m = 0;
    q.o.forEach(function(o){ if (o.s[k] && o.s[k] > m) m = o.s[k]; });
    MAXP[k] += m;
  });
});

var idx = 0, answers = [], userName = '';
var $ = function(id){ return document.getElementById(id); };
var cover = $('cover'), quiz = $('quiz'), result = $('result');

function show(el){
  [cover, quiz, result].forEach(function(x){ x.classList.add('hide'); });
  el.classList.remove('hide');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(){
  var q = QUESTIONS[idx];
  $('stepText').textContent = (idx+1) + ' / ' + QUESTIONS.length;
  $('pctText').textContent = Math.round(idx / QUESTIONS.length * 100) + '%';
  $('barFill').style.width = (idx / QUESTIONS.length * 100) + '%';
  $('qnum').textContent = 'Q' + (idx+1);
  $('qtext').textContent = q.q;
  var box = $('opts');
  box.innerHTML = '';
  var letters = ['A','B','C','D'];
  q.o.forEach(function(o, i){
    var b = document.createElement('button');
    b.className = 'opt' + (answers[idx] === i ? ' sel' : '');
    b.innerHTML = '<span class="k">' + letters[i] + '</span><span>' + o.t + '</span>';
    b.onclick = function(){
      answers[idx] = i;
      Array.prototype.forEach.call(box.children, function(c){ c.classList.remove('sel'); });
      b.classList.add('sel');
      burst(3);
      setTimeout(function(){
        if (idx < QUESTIONS.length - 1){ idx++; renderQuestion(); }
        else { finish(); }
      }, 260);
    };
    box.appendChild(b);
  });
  $('backBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
}

function compute(){
  var raw = {};
  KEYS.forEach(function(k){ raw[k] = 0; });
  answers.forEach(function(a, qi){
    if (a === null || a === undefined) return;
    var s = QUESTIONS[qi].o[a].s;
    for (var k in s) raw[k] += s[k];
  });
  var norm = {};
  KEYS.forEach(function(k){ norm[k] = MAXP[k] ? raw[k] / MAXP[k] : 0; });
  var ranked = KEYS.slice().sort(function(a,b){ return norm[b] - norm[a]; });
  return { ranked: ranked, norm: norm };
}

function finish(){
  var r = compute();
  var ranked = r.ranked, norm = r.norm;
  var top = TYPES[ranked[0]];
  show(result);
  $('rEmoji').textContent = top.emoji;
  $('rName').textContent = (userName ? userName + ' 是 ' : '你是 ') + top.name;
  $('rTag').textContent = top.tag;
  $('rTraits').innerHTML = top.traits.map(function(t){ return '<li>' + t + '</li>'; }).join('');
  $('rOwner').textContent = top.owner;
  $('rBest').textContent = top.best;
  $('rMission').textContent = top.mission;
  var mix = $('mix');
  mix.innerHTML = '';
  ranked.slice(0,3).forEach(function(k, i){
    var pct = Math.round(20 + norm[k] * 80);
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<b>' + TYPES[k].name + '</b><div class="track"><i></i></div><span>' + pct + '%</span>';
    mix.appendChild(row);
    setTimeout(function(){ row.querySelector('i').style.width = pct + '%'; }, 120 + i*110);
  });
  burst(18);
  window.__result = { top: top, ranked: ranked, norm: norm };
  window.scrollTo({top:0});
}

function burst(n){
  var chars = ['💗','🐾','✨','💕','🌸'];
  for (var i=0;i<n;i++){
    var h = document.createElement('div');
    h.className = 'heart';
    h.textContent = chars[Math.floor(Math.random()*chars.length)];
    h.style.left = (12 + Math.random()*76) + 'vw';
    h.style.top = (18 + Math.random()*40) + 'vh';
    h.style.setProperty('--dx', (Math.random()*120 - 60).toFixed(0) + 'px');
    h.style.setProperty('--rot', (Math.random()*300 - 150).toFixed(0) + 'deg');
    h.style.animationDelay = (Math.random()*.35).toFixed(2) + 's';
    document.body.appendChild(h);
    setTimeout(function(){ h.remove(); }, 2400);
  }
}

var toastTimer;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1800);
}

function reset(){
  idx = 0;
  answers = new Array(QUESTIONS.length).fill(null);
}

$('startBtn').onclick = function(){
  userName = ($('nameInput').value || '').trim().slice(0,8);
  reset();
  show(quiz);
  renderQuestion();
};
$('backBtn').onclick = function(){ if (idx > 0){ idx--; renderQuestion(); } };
$('againBtn').onclick = function(){ reset(); show(cover); };
$('copyBtn').onclick = function(){
  var r = window.__result;
  if (!r) return;
  var t = r.top;
  var name = userName || '我';
  var text = '【' + name + '的小狗人格】' + t.emoji + ' ' + t.name + '\n'
    + '一句话：' + t.tag + '\n'
    + '性格成分：' + r.ranked.slice(0,3).map(function(k){
        return TYPES[k].name + ' ' + Math.round(20 + r.norm[k]*80) + '%';
      }).join(' · ') + '\n'
    + '我需要这样的铲屎官：' + t.owner + '\n'
    + '今日小任务：' + t.mission + '\n'
    + '——你是哪种小狗？也来测测看 🐾';
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制，去粘给他吧 💌'); }
    catch(e){ toast('复制失败，截图也行～'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('已复制，去粘给他吧 💌'); }, fallback);
  } else { fallback(); }
};
$('nameInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') $('startBtn').click();
});
</script>
